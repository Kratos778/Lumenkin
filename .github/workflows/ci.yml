name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android licenses & install packages
        run: |
          # Locate sdkmanager
          SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMANAGER"

          # Accept all licenses non-interactively
          yes | $SDKMANAGER --licenses >/dev/null 2>&1 || true

          # Install only what we need (no deprecated 'tools' package)
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run Lint
        run: gradle lintDebug --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lumenkin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
